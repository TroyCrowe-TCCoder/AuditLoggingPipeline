name: Publish NuGet Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Pack AuditLoggingPipeline.Models
        run: dotnet pack AuditLoggingPipeline.Models/AuditLoggingPipeline.Models.csproj -c Release -o "${{ github.workspace }}/nupkgs"

      - name: Pack AuditLoggingPipeline
        run: dotnet pack AuditLoggingPipeline/AuditLoggingPipeline.csproj -c Release -o "${{ github.workspace }}/nupkgs"

      - name: Pack AuditLoggingPipeline.Tracker
        run: dotnet pack AuditLoggingPipeline.Tracker/AuditLoggingPipeline.Tracker.csproj -c Release -o "${{ github.workspace }}/nupkgs"

      - name: List packed nupkgs
        run: Get-ChildItem -Path "${{ github.workspace }}/nupkgs" -Filter *.nupkg -ErrorAction SilentlyContinue | Format-Table -AutoSize

      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: TroyCrowe

      - name: Push all packages
        run: |
          $ErrorActionPreference = "Stop"
          $packages = Get-ChildItem -Path "${{ github.workspace }}/nupkgs" -Filter *.nupkg
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
